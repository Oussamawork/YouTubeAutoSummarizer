name: Weekly Channel Scorecard

on:
  schedule:
    - cron: '0 16 * * 5'  # Fridays at 16:00 UTC
  workflow_dispatch:       # Allows manual triggering from GitHub UI

permissions:
  contents: read  # read-only over the research claims and data/prices.json; nothing is committed

jobs:
  # The Friday report (channel_scorecard.py), in the order it is sent:
  #   1. Creators vs the market: every creator's calls since they were made,
  #      marked to Thursday's close (the last completed session) against the
  #      S&P 500 (crypto: Bitcoin) over the same days. Mark-to-market, not a
  #      verdict; creators are ordered by number of calls and never ranked.
  #      Read from data/prices.json only — the Friday 06:00 UTC warm-prices
  #      run fills it — so this part spends no price requests.
  #   2. Its two charts as one photo album (best-effort: a failed album is
  #      logged, never fails the run).
  #   3. The strict scorecard: matured, dated forecasts only (EXPERIMENTAL,
  #      unranked), compact below its sample minimum (one plain line per
  #      scored forecast, when the next ones mature), with a one-line count of
  #      the last 30 days' conditional calls.
  #      Its matured forecasts are the job's only live price requests (cache
  #      first, live for gaps), capped by TWELVEDATA_MAX_REQUESTS (120).
  send-scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send weekly channel scorecard
        run: python channel_scorecard.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TWELVEDATA_API: ${{ secrets.TWELVEDATA_API }}

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if [ -z "${TELEGRAM_TOKEN}" ] || [ -z "${TELEGRAM_CHANNEL_ID}" ]; then
            echo "Telegram secrets not set; cannot send failure alert."
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TEXT="🚨 Weekly Channel Scorecard workflow failed.
          Repo: ${GITHUB_REPOSITORY}
          Run: ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHANNEL_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null \
            || echo "Failed to send Telegram failure alert."
