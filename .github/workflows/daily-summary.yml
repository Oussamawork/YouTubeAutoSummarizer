name: Daily YouTube Summary

on:
  schedule:
    - cron: '0 22 * * *'  # Runs daily at 22:00 UTC
  workflow_dispatch:      # Allows manual triggering from GitHub UI
    inputs:
      video_url:
        description: 'Optional: summarize this one video URL on demand (skips the channel scan and dedup)'
        required: false
        type: string

# Write access is needed to commit the dedup state (seen_videos.json) back.
permissions:
  contents: write

# Prevent overlapping runs from racing on the committed state file.
concurrency:
  group: daily-summary
  cancel-in-progress: false

jobs:
  run-summarizer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          if [ -n "${VIDEO_URL}" ]; then
            python scraper.py --video-url "${VIDEO_URL}"
          else
            python scraper.py
          fi
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          # LLM summarizer (provider-agnostic). Set whichever you use; the
          # summarizer tries the generic LLM_* provider first, then Gemini, then Groq.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # Optional behavior tuning (repo variables, all have defaults):
          # DAILY_DIGEST=true bundles all of a run's summaries into one message;
          # MAX_VIDEOS_PER_RUN caps videos processed per channel per run.
          DAILY_DIGEST: ${{ vars.DAILY_DIGEST }}
          MAX_VIDEOS_PER_RUN: ${{ vars.MAX_VIDEOS_PER_RUN }}
          # Optional free/premium split: teasers (TL;DR + link) go to the free
          # public channel, full summaries stay in the main (premium) channel.
          TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}
          PREMIUM_INVITE_URL: ${{ vars.PREMIUM_INVITE_URL }}
          # Market-signal recording to data/signals.jsonl (committed back
          # below) is ON by default; set the repo variable to false to disable.
          MARKET_SIGNALS: ${{ vars.MARKET_SIGNALS }}

      - name: Persist dedup state and signals
        if: always()  # commit progress even if the scraper step failed mid-run
        run: |
          if git status --porcelain seen_videos.json data/signals.jsonl | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_videos.json
            if [ -f data/signals.jsonl ]; then
              git add data/signals.jsonl
            fi
            git commit -m "chore: update seen videos and signals [skip ci]"
            # Rebase onto any concurrent change, then push — retry on rejection,
            # and fail loudly if it never lands (so dedup drift / re-sends are visible).
            pushed=false
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=true
                break
              fi
              echo "Push attempt ${attempt} failed; retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
            if [ "${pushed}" != "true" ]; then
              echo "::error::Failed to persist seen_videos.json after 3 attempts; dedup state may drift (risk of re-sends)."
              exit 1
            fi
          else
            echo "seen_videos.json unchanged; nothing to commit."
          fi

      - name: Alert on failure
        if: failure()  # any prior step failed (scraper crash, push failure, etc.)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if [ -z "${TELEGRAM_TOKEN}" ] || [ -z "${TELEGRAM_CHANNEL_ID}" ]; then
            echo "Telegram secrets not set; cannot send failure alert."
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TEXT="🚨 Daily YouTube Summary workflow failed.
          Repo: ${GITHUB_REPOSITORY}
          Run: ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHANNEL_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null \
            || echo "Failed to send Telegram failure alert."
