name: Daily YouTube Summary

on:
  schedule:
    # In investing the value of a summary decays fast, so the feed is polled
    # through the hours these channels actually publish (roughly 12:00-22:00
    # UTC) rather than once a day. Overnight gets two catch-all runs.
    - cron: '0 12-22/2 * * *'   # every 2h, 12:00-22:00 UTC
    - cron: '0 2,7 * * *'       # overnight catch-up
  workflow_dispatch:      # Allows manual triggering from GitHub UI
    inputs:
      video_url:
        description: 'Optional: summarize this one video URL on demand (skips the channel scan and dedup)'
        required: false
        type: string

# Write access is needed to commit the dedup state (seen_videos.json) back.
permissions:
  contents: write

# Prevent overlapping runs from racing on the committed state file.
concurrency:
  group: daily-summary
  cancel-in-progress: false

jobs:
  run-summarizer:
    runs-on: ubuntu-latest
    # A Gemini transcript takes ~2 minutes (it processes the video itself),
    # against ~3 seconds for a Supadata one, so a run that falls back to Gemini
    # for several videos needs materially more room than the old 20.
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          if [ -n "${VIDEO_URL}" ]; then
            python scraper.py --video-url "${VIDEO_URL}"
          else
            python scraper.py
          fi
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          # Optional extra free-tier keys; each adds SUPADATA_CREDITS_PER_KEY
          # to the monthly transcript budget and is used when earlier keys run out.
          SUPADATA_API_KEY_2: ${{ secrets.SUPADATA_API_KEY_2 }}
          SUPADATA_API_KEY_3: ${{ secrets.SUPADATA_API_KEY_3 }}
          # Free-tier credits per key (default 100) and an optional explicit
          # monthly budget override, both repo variables.
          SUPADATA_CREDITS_PER_KEY: ${{ vars.SUPADATA_CREDITS_PER_KEY }}
          SUPADATA_MONTHLY_BUDGET: ${{ vars.SUPADATA_MONTHLY_BUDGET }}
          # Day of month the plan's credits reset (Supadata dashboard shows it,
          # e.g. "Credits reset on 08/17" -> 17). Default 1 = calendar month.
          SUPADATA_RESET_DAY: ${{ vars.SUPADATA_RESET_DAY }}
          # Ration the cycle's credits across its remaining days. Off by
          # default, so a run processes everything published that day; set to
          # true to make the pool last until the reset date instead.
          SUPADATA_DAILY_PACING: ${{ vars.SUPADATA_DAILY_PACING }}
          # Models used to transcribe a video from its YouTube URL when
          # Supadata has no credits (comma separated, tried in order). Free-tier
          # quota is per model, so each entry adds its own daily budget; keep
          # GEMINI_MODEL out of this list so summaries and transcripts never
          # compete for the same one.
          GEMINI_TRANSCRIPT_MODELS: ${{ vars.GEMINI_TRANSCRIPT_MODELS }}
          # LLM summarizer (provider-agnostic). Set whichever you use; the
          # summarizer tries the generic LLM_* provider first, then Gemini, then Groq.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional model overrides (repo variables) — upgrade models without
          # a code change; defaults live in summarizer.py. GEMINI_FALLBACK_MODELS
          # is the summary chain after GEMINI_MODEL: each entry adds its own
          # daily free-tier quota, so keep it disjoint from the transcript list.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # Optional behavior tuning (repo variables, all have defaults):
          # DAILY_DIGEST=true bundles all of a run's summaries into one message;
          # MAX_VIDEOS_PER_RUN caps videos processed per channel per run.
          DAILY_DIGEST: ${{ vars.DAILY_DIGEST }}
          MAX_VIDEOS_PER_RUN: ${{ vars.MAX_VIDEOS_PER_RUN }}
          # How hard to chase a transcript before writing a video off. Both
          # gates must pass, so a fast schedule can't burn through the attempt
          # count before captions have had time to appear.
          NO_TRANSCRIPT_MAX_ATTEMPTS: ${{ vars.NO_TRANSCRIPT_MAX_ATTEMPTS }}
          NO_TRANSCRIPT_MIN_HOURS: ${{ vars.NO_TRANSCRIPT_MIN_HOURS }}
          # Minimum gap between retries of one deferred video, so polling often
          # doesn't spend a transcript credit per run on the same video.
          PENDING_RETRY_MIN_HOURS: ${{ vars.PENDING_RETRY_MIN_HOURS }}
          # Optional free/premium split: teasers (TL;DR + link) go to the free
          # public channel, full summaries stay in the main (premium) channel.
          TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}
          PREMIUM_INVITE_URL: ${{ vars.PREMIUM_INVITE_URL }}
          # Market-signal recording to data/signals.jsonl (committed back
          # below) is ON by default; set the repo variable to false to disable.
          MARKET_SIGNALS: ${{ vars.MARKET_SIGNALS }}
          # Research capture (all optional, defaults in code): raw transcripts
          # are persisted gzip'd under data/transcripts/ (PERSIST_TRANSCRIPTS);
          # model input limits come from the live metadata endpoint with a
          # registry fallback (LLM_LIVE_CAPABILITIES); request size is counted
          # with countTokens when available (LLM_LIVE_COUNT_TOKENS); the free
          # tier's per-minute token cap bounds one request (GEMINI_FREE_TIER_TPM).
          PERSIST_TRANSCRIPTS: ${{ vars.PERSIST_TRANSCRIPTS }}
          # Languages a transcript may be in when a channel line sets no
          # lang= (default en,de: the claims guard's rule sets).
          TRANSCRIPT_LANGUAGES: ${{ vars.TRANSCRIPT_LANGUAGES }}
          LLM_LIVE_CAPABILITIES: ${{ vars.LLM_LIVE_CAPABILITIES }}
          LLM_LIVE_COUNT_TOKENS: ${{ vars.LLM_LIVE_COUNT_TOKENS }}
          GEMINI_FREE_TIER_TPM: ${{ vars.GEMINI_FREE_TIER_TPM }}
          CONTEXT_SAFETY_MARGIN_TOKENS: ${{ vars.CONTEXT_SAFETY_MARGIN_TOKENS }}
          EXHAUSTIVE_RESEARCH_MODE: ${{ vars.EXHAUSTIVE_RESEARCH_MODE }}

      - name: Re-capture transcripts served in the wrong language
        # A caption track in a language the channel does not speak (a
        # translation or auto-dub) is refused at fetch time; this retires any
        # such capture that is already stored (offline check, no credit),
        # then re-fetches a few of them in the channel's language under the
        # normal transcript budget and extracts their claims.
        if: ${{ !inputs.video_url }}
        run: python research_backfill.py --reject-foreign-transcripts --refetch
        env:
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          SUPADATA_API_KEY_2: ${{ secrets.SUPADATA_API_KEY_2 }}
          SUPADATA_API_KEY_3: ${{ secrets.SUPADATA_API_KEY_3 }}
          SUPADATA_CREDITS_PER_KEY: ${{ vars.SUPADATA_CREDITS_PER_KEY }}
          SUPADATA_MONTHLY_BUDGET: ${{ vars.SUPADATA_MONTHLY_BUDGET }}
          SUPADATA_RESET_DAY: ${{ vars.SUPADATA_RESET_DAY }}
          SUPADATA_DAILY_PACING: ${{ vars.SUPADATA_DAILY_PACING }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TRANSCRIPT_MODELS: ${{ vars.GEMINI_TRANSCRIPT_MODELS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_LIVE_CAPABILITIES: ${{ vars.LLM_LIVE_CAPABILITIES }}
          LLM_LIVE_COUNT_TOKENS: ${{ vars.LLM_LIVE_COUNT_TOKENS }}
          TRANSCRIPT_LANGUAGES: ${{ vars.TRANSCRIPT_LANGUAGES }}
          RESEARCH_REFETCH_MAX_VIDEOS: ${{ vars.RESEARCH_REFETCH_MAX_VIDEOS }}

      - name: Retry pending research extractions
        # Videos whose summary went out but whose claims failed, were
        # quota-deferred or only partially covered are retried here from
        # their stored transcripts (no transcript credit). Bounded per run
        # and quota-aware; never touches delivery state.
        if: ${{ !inputs.video_url }}
        run: python research_backfill.py --retry
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_LIVE_CAPABILITIES: ${{ vars.LLM_LIVE_CAPABILITIES }}
          LLM_LIVE_COUNT_TOKENS: ${{ vars.LLM_LIVE_COUNT_TOKENS }}
          RESEARCH_BACKFILL_MAX_VIDEOS: ${{ vars.RESEARCH_BACKFILL_MAX_VIDEOS }}

      - name: Persist dedup state, signals and research data
        if: always()  # commit progress even if the scraper step failed mid-run
        run: |
          if git status --porcelain seen_videos.json data/ | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_videos.json
            if [ -f data/signals.jsonl ]; then
              git add data/signals.jsonl
            fi
            if [ -f data/supadata_usage.json ]; then
              git add data/supadata_usage.json
            fi
            # Per-model daily request counts. Committed for the same reason as
            # the Supadata counter: each run is a fresh runner, so without this
            # every run rediscovers a spent model by spending a request on it.
            if [ -f data/gemini_usage.json ]; then
              git add data/gemini_usage.json
            fi
            # Research products: raw transcripts (gzip), the research ledger,
            # claims and their run history, and the cached model limits. All
            # append-only or atomically written; committed so the next run
            # (a fresh runner) can retry research without refetching.
            for path in data/transcripts data/research data/model_capabilities.json; do
              if [ -e "$path" ]; then
                git add "$path"
              fi
            done
            git commit -m "chore: update seen videos, signals and research data [skip ci]"
            # Rebase onto any concurrent change, then push — retry on rejection,
            # and fail loudly if it never lands (so dedup drift / re-sends are visible).
            pushed=false
            for attempt in 1 2 3; do
              # A conflicted rebase must never fall through to the push. `|| true`
              # swallowed the conflict, leaving the run's commit stranded on a
              # detached HEAD; `git push` then printed "Everything up-to-date"
              # and exited 0, so this step reported success while discarding the
              # whole run — watermarks, counters and signals — and the next run
              # re-sent summaries it had already delivered. Abort and retry.
              if ! git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
                echo "Rebase onto ${GITHUB_REF_NAME} failed; aborting it rather than pushing a stranded HEAD."
                git rebase --abort || true
                sleep $((attempt * 5))
                continue
              fi
              local_head="$(git rev-parse HEAD)"
              # Trust the ref, not the exit code: `git push` also exits 0 when it
              # has nothing to push, which is exactly the case above.
              if git push origin "HEAD:${GITHUB_REF_NAME}" \
                && git fetch origin "${GITHUB_REF_NAME}" \
                && git merge-base --is-ancestor "${local_head}" FETCH_HEAD; then
                pushed=true
                break
              fi
              echo "Push attempt ${attempt} did not land; retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
            if [ "${pushed}" != "true" ]; then
              echo "::error::Failed to persist run state after 3 attempts; seen_videos.json, the Gemini/Supadata counters and signals were not saved (risk of re-sends)."
              exit 1
            fi
          else
            echo "seen_videos.json unchanged; nothing to commit."
          fi

      - name: Alert on failure
        if: failure()  # any prior step failed (scraper crash, push failure, etc.)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if [ -z "${TELEGRAM_TOKEN}" ] || [ -z "${TELEGRAM_CHANNEL_ID}" ]; then
            echo "Telegram secrets not set; cannot send failure alert."
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TEXT="🚨 Daily YouTube Summary workflow failed.
          Repo: ${GITHUB_REPOSITORY}
          Run: ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHANNEL_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null \
            || echo "Failed to send Telegram failure alert."
