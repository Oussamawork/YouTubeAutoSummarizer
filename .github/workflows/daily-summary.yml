name: Daily YouTube Summary

on:
  schedule:
    - cron: '0 22 * * *'  # Runs daily at 22:00 UTC
  workflow_dispatch:      # Allows manual triggering from GitHub UI

# Write access is needed to commit the dedup state (seen_videos.json) back.
permissions:
  contents: write

# Prevent overlapping runs from racing on the committed state file.
concurrency:
  group: daily-summary
  cancel-in-progress: false

jobs:
  run-summarizer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          # LLM summarizer (provider-agnostic). Set whichever you use; the
          # summarizer tries the generic LLM_* provider first, then Gemini, then Groq.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}

      - name: Persist dedup state
        if: always()  # commit progress even if the scraper step failed mid-run
        run: |
          if git status --porcelain seen_videos.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_videos.json
            git commit -m "chore: update seen videos [skip ci]"
            # Rebase onto any concurrent change before pushing, then push.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "seen_videos.json unchanged; nothing to commit."
          fi
