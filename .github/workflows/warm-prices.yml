name: Warm Price Cache

# The price provider's free tier allows 8 requests/minute and the dataset spans
# hundreds of symbols, so this job — not the Monday pulse or the Friday
# scorecard — is the one allowed to be slow. It tops up data/prices.json ahead
# of both. Closes are immutable, so a covered symbol is never refetched: only
# new tickers and still-open horizons cost anything after the first run.

on:
  schedule:
    - cron: '0 6 * * 0'  # Sundays at 06:00 UTC, ahead of the Monday pulse
  workflow_dispatch:      # Allows manual triggering from GitHub UI
    inputs:
      probe:
        description: 'Comma-separated symbols to check (e.g. nu.us,aapl.us) instead of warming the cache'
        type: string
        default: ''
      probe_days:
        description: 'Look-back windows for the probe, comma-separated days (e.g. 3,10,60)'
        type: string
        default: '10'
      find:
        description: 'Comma-separated company names to look up (prints real ticker, exchange, currency)'
        type: string
        default: ''
      resolve:
        description: 'Resolve unpriceable tickers and commit data/ticker_map.json'
        type: boolean
        default: false

permissions:
  contents: write  # commits the refreshed data/prices.json

jobs:
  warm-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # 8 requests/minute; a cold start is ~180 symbols

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Warm the price cache
        # Dispatch inputs are read from the environment, never interpolated
        # into the script: `${{ inputs.find }}` expands before the shell sees
        # it, so a value containing quotes would run as a command.
        run: |
          if [ "${RESOLVE}" = "true" ]; then
            python warm_prices.py --resolve
          elif [ -n "${FIND}" ]; then
            python warm_prices.py --find "${FIND}"
          elif [ -n "${PROBE}" ]; then
            python warm_prices.py --probe "${PROBE}" --probe-days "${PROBE_DAYS:-10}"
          else
            python warm_prices.py
          fi
        env:
          RESOLVE: ${{ inputs.resolve }}
          FIND: ${{ inputs.find }}
          PROBE: ${{ inputs.probe }}
          PROBE_DAYS: ${{ inputs.probe_days }}
          TWELVEDATA_API: ${{ secrets.TWELVEDATA_API }}
          # This job is the slow one by design, so it gets a far larger share
          # of the 800/day quota than the interactive weekly jobs.
          TWELVEDATA_MAX_REQUESTS: '600'
          # --resolve asks the LLM to correct mis-heard company names; the
          # suggestion is only accepted once the provider's catalogue confirms
          # the ticker exists and belongs to that company.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Persist the price cache
        if: ${{ inputs.probe == '' && inputs.find == '' }}
        run: |
          if git status --porcelain data/prices.json data/ticker_map.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- data/prices.json data/ticker_map.json
            git commit -m "chore: warm price cache [skip ci]"
            pushed=false
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=true
                break
              fi
              echo "Push attempt ${attempt} failed; retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
            if [ "${pushed}" != "true" ]; then
              echo "::error::Failed to persist data/prices.json after 3 attempts; the weekly jobs will refetch."
              exit 1
            fi
          else
            echo "Price cache unchanged; nothing to commit."
          fi

      - name: Alert on failure
        # Probe/find runs are diagnostics: a symbol that does not resolve is
        # the answer being looked for, not a broken workflow, so they must not
        # page the Telegram channel.
        if: ${{ failure() && inputs.probe == '' && inputs.find == '' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if [ -z "${TELEGRAM_TOKEN}" ] || [ -z "${TELEGRAM_CHANNEL_ID}" ]; then
            echo "Telegram secrets not set; cannot send failure alert."
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TEXT="🚨 Warm Price Cache workflow failed.
          Repo: ${GITHUB_REPOSITORY}
          Run: ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHANNEL_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null \
            || echo "Failed to send Telegram failure alert."
