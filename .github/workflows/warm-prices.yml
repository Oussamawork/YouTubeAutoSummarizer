name: Warm Price Cache

# The price provider's free tier allows 8 requests/minute and the dataset spans
# hundreds of symbols, so this job — not the Monday pulse or the Friday
# report — is the one allowed to be slow. It tops up data/prices.json twice a
# week, ahead of each:
#   - Sundays 06:00 UTC, for the Monday pulse (Friday's close);
#   - Fridays 06:00 UTC, for the 16:00 UTC Friday report (Thursday's close).
# Both reports mark every creator's calls to market from this cache alone
# (creator_tracker.cache_fetcher, never a live request), so the warm covers
# everything the tracker reads (creator_tracker.needed_price_ranges): each
# call's symbol from the day before the call, the S&P 500 and Bitcoin
# benchmarks, and the market context (SPY, QQQ, BTC, ETH).
# Requests stop at the last completed session (crypto: yesterday, UTC), so the
# warm day's in-progress bar is never stored as a close, and refetching an
# open range replaces any partial bar stored before. Closes are immutable: a
# covered range is never refetched, and each open range costs one request per
# symbol per run (a closed call's range ends soon after it closes; the
# tracker looks back TRACKER_LOOKBACK_DAYS, 180) — about 150-250 a run today,
# 25-40 minutes at 6/minute. The run is bounded however the book grows:
# requests go out in priority order (S&P 500 and Bitcoin first, then the
# tracker's symbols, stalest first), none starts after WARM_DEADLINE_MINUTES
# (75), the cache is saved every 50 symbols, and the 450-request cap
# (75 minutes x 6/minute) stays inside the 90-minute timeout with room for the
# audit and persist steps. Whatever a run leaves goes first in the next one.

on:
  schedule:
    - cron: '0 6 * * 0'  # Sundays at 06:00 UTC, ahead of the Monday pulse
    - cron: '0 6 * * 5'  # Fridays at 06:00 UTC, ahead of the 16:00 UTC Friday report
  workflow_dispatch:      # Allows manual triggering from GitHub UI
    inputs:
      probe:
        description: 'Comma-separated symbols to check (e.g. nu.us,aapl.us) instead of warming the cache'
        type: string
        default: ''
      find:
        description: 'Comma-separated company names to look up (prints real ticker, exchange, currency)'
        type: string
        default: ''
      resolve:
        description: 'Resolve unpriceable tickers and commit data/ticker_map.json'
        type: boolean
        default: false

permissions:
  contents: write  # commits the refreshed data/prices.json

jobs:
  warm-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # the warm stops starting requests at 75 minutes (WARM_DEADLINE_MINUTES)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Warm the price cache
        # Inputs reach the shell through environment variables, never by
        # expanding `${{ }}` inside the script: an expansion is pasted into the
        # command text before the shell sees it, so a crafted input could run
        # arbitrary commands with this job's secrets.
        run: |
          if [ "${RESOLVE}" = "true" ]; then
            python warm_prices.py --resolve
          elif [ -n "${FIND}" ]; then
            python warm_prices.py --find "${FIND}"
          elif [ -n "${PROBE}" ]; then
            python warm_prices.py --probe "${PROBE}"
          else
            python warm_prices.py
          fi
        env:
          RESOLVE: ${{ inputs.resolve }}
          FIND: ${{ inputs.find }}
          PROBE: ${{ inputs.probe }}
          TWELVEDATA_API: ${{ secrets.TWELVEDATA_API }}
          # This job is the slow one by design, so it gets a far larger share
          # of the 800/day quota than the interactive weekly jobs: as many
          # requests as 75 minutes at 6/minute allow (the deadline below).
          TWELVEDATA_MAX_REQUESTS: '450'
          WARM_DEADLINE_MINUTES: '75'
          # --resolve asks the LLM to correct mis-heard company names; the
          # suggestion is only accepted once the provider's catalogue confirms
          # the ticker exists and belongs to that company.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Ticker audit (informational)
        # Offline and read-only (no key, no network, edits nothing): checks
        # the freshly warmed cache and the ticker tables for wrong
        # instruments, orphaned series and partial candles, and prints the
        # worklist to this log. It never fails or blocks the warm.
        if: ${{ inputs.probe == '' && inputs.find == '' && !inputs.resolve }}
        continue-on-error: true
        run: python ticker_audit.py

      - name: Persist the price cache
        if: ${{ inputs.probe == '' && inputs.find == '' }}
        run: |
          if git status --porcelain data/prices.json data/ticker_map.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- data/prices.json data/ticker_map.json
            git commit -m "chore: warm price cache [skip ci]"
            # Same loop as daily-summary.yml, for the same reason: the daily
            # job commits to this branch up to twelve times a day, so a rebase
            # conflict here is routine. `|| true` on the rebase used to leave a
            # conflicted, detached HEAD that `git push` reported as
            # "Everything up-to-date" with exit 0 — the whole 90-minute warm run
            # silently discarded. Abort and retry instead, and trust the ref
            # rather than the push's exit code.
            pushed=false
            for attempt in 1 2 3; do
              if ! git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
                echo "Rebase onto ${GITHUB_REF_NAME} failed; aborting it rather than pushing a stranded HEAD."
                git rebase --abort || true
                sleep $((attempt * 5))
                continue
              fi
              local_head="$(git rev-parse HEAD)"
              if git push origin "HEAD:${GITHUB_REF_NAME}" \
                && git fetch origin "${GITHUB_REF_NAME}" \
                && git merge-base --is-ancestor "${local_head}" FETCH_HEAD; then
                pushed=true
                break
              fi
              echo "Push attempt ${attempt} did not land; retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
            if [ "${pushed}" != "true" ]; then
              echo "::error::Failed to persist data/prices.json after 3 attempts; the weekly jobs will refetch."
              exit 1
            fi
          else
            echo "Price cache unchanged; nothing to commit."
          fi

      - name: Alert on failure
        # Probe/find runs are diagnostics: a symbol that does not resolve is
        # the answer being looked for, not a broken workflow, so they must not
        # page the Telegram channel.
        if: ${{ failure() && inputs.probe == '' && inputs.find == '' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if [ -z "${TELEGRAM_TOKEN}" ] || [ -z "${TELEGRAM_CHANNEL_ID}" ]; then
            echo "Telegram secrets not set; cannot send failure alert."
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TEXT="🚨 Warm Price Cache workflow failed.
          Repo: ${GITHUB_REPOSITORY}
          Run: ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHANNEL_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null \
            || echo "Failed to send Telegram failure alert."
