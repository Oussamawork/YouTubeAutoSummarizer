name: Phase verification (temporary)

# Exercises the real modules against a real backlog video — the same calls
# scraper.main() makes per video — and prints the outcome. Nothing is sent to
# Telegram and no dedup state is written.
#
# Temporary: deleted once the phases are verified.

on:
  push:
    branches: [claude/telegram-summaries-not-sending-b5421w]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Transcript + summary through the real code path
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Deliberately NOT setting GEMINI_MODEL / LLM_MAX_TOKENS: the point is
          # that the shipped defaults resolve to 3.7 for summaries and to the
          # separate transcription models, with no repo variables configured.
          # No SUPADATA_API_KEY either — its credits are spent anyway, so this
          # proves the Gemini path carries a run on its own.
          MARKET_SIGNALS: 'true'
        run: |
          python - <<'PY'
          import time
          import scraper
          import summarizer
          import transcript as transcript_mod
          from transcript import get_transcript_from_video

          print("=" * 72)
          print("MODEL ROUTING AS SHIPPED (no repo variables set)")
          print("=" * 72)
          summary_models = [p["model"] for p in summarizer._provider_configs()]
          transcript_models = transcript_mod._gemini_transcript_models()
          print(f"  summaries:   {summary_models}")
          print(f"  transcripts: {transcript_models}")
          print(f"  max_tokens:  {summarizer.LLM_MAX_TOKENS}")
          assert summary_models[0] == "gemini-3.7-flash", summary_models
          assert set(summary_models).isdisjoint(transcript_models), "budgets overlap!"
          print("  OK: summaries lead with 3.7 and share no model with transcripts")
          print()

          VIDEO = "https://www.youtube.com/watch?v=6lXWHHsJyV8"  # stuck in pending
          print("=" * 72)
          print("get_transcript_from_video() — the real function, real video")
          print("=" * 72)
          t0 = time.time()
          result = get_transcript_from_video(VIDEO)
          text = result["transcript"]
          print(f"\n  elapsed:          {time.time() - t0:.1f}s")
          print(f"  reason:           {result['reason']}")
          print(f"  budget_exhausted: {result['budget_exhausted']}")
          print(f"  transcript:       {len(text)} chars")
          print(f"  opening:          {text[:200]}...")

          print()
          print("=" * 72)
          print("scraper._summarize_video() — what main() calls per video")
          print("=" * 72)
          details = {
              "video_id": "6lXWHHsJyV8",
              "channel_name": "TheStreet",
              "video_title": "Semiconductor Stocks Opportunity or Trap? Carter Worth Answers Rapid Fire Questions",
              "video_url": VIDEO,
              "published_at": "2026-08-12T15:02:16+00:00",
          }
          t0 = time.time()
          body, outcome, decided, signals = scraper._summarize_video(
              details, no_transcript_attempts=0, compact=False, want_signals=True,
              hours_since_first=40.0,
          )
          print(f"\n  elapsed: {time.time() - t0:.1f}s")
          print(f"  outcome: {outcome}   decided: {decided}")
          print(f"  signals: {len(signals.get('assets', [])) if signals else 0} asset(s)")
          print(f"  transcript_reason: {details.get('transcript_reason')}")
          print("\n" + "-" * 72)
          print(body)
          print("-" * 72)

          ok = outcome == "sent" or (body and decided)
          print(f"\nRESULT: {'PASS' if ok else 'FAIL'} (outcome={outcome})")
          raise SystemExit(0 if ok else 1)
          PY
