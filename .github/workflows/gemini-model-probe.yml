name: Gemini model probe (temporary)

# Answers two questions that cannot be answered from a dev sandbox:
#   1. which Gemini models this project's GEMINI_API_KEY can actually see, and
#   2. whether a generateContent call to each candidate model succeeds, is
#      rejected as unknown, or is refused for quota/billing reasons.
# The quota/billing error text is the tell for "is this model on the free
# tier for us" — a free-tier project calling a paid-only model gets a
# RESOURCE_EXHAUSTED / PERMISSION_DENIED naming the tier, not a summary.
#
# Temporary: delete this file once the question is settled.

on:
  push:
    branches: [claude/telegram-summaries-not-sending-b5421w]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe the Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request

          KEY = os.environ.get("GEMINI_API_KEY", "")
          if not KEY:
              print("GEMINI_API_KEY is not set; nothing to probe.")
              raise SystemExit(0)

          BASE = "https://generativelanguage.googleapis.com/v1beta"
          # The key travels in a header, never in a URL, so it cannot leak into
          # a logged request line.
          HEADERS = {"x-goog-api-key": KEY, "Content-Type": "application/json"}


          def call(url, payload=None):
              """(status, parsed_body_or_text). Never raises, never prints the key."""
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, headers=HEADERS,
                                           method="POST" if data else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      return resp.status, json.loads(resp.read().decode())
              except urllib.error.HTTPError as e:
                  raw = e.read().decode(errors="replace")
                  try:
                      return e.code, json.loads(raw)
                  except ValueError:
                      return e.code, raw
              except Exception as e:  # network/DNS/timeout
                  return 0, f"{type(e).__name__}: {e}"


          print("=" * 72)
          print("1. MODELS THIS KEY CAN SEE (flash family)")
          print("=" * 72)
          status, body = call(f"{BASE}/models?pageSize=1000")
          print(f"GET /models -> HTTP {status}")
          if isinstance(body, dict) and "models" in body:
              flash = [m for m in body["models"] if "flash" in m.get("name", "")]
              print(f"{len(body['models'])} models total, {len(flash)} flash:\n")
              for m in sorted(flash, key=lambda m: m["name"]):
                  name = m["name"].removeprefix("models/")
                  methods = ",".join(m.get("supportedGenerationMethods", []))
                  print(f"  {name:<38} in={m.get('inputTokenLimit'):<9} "
                        f"out={m.get('outputTokenLimit'):<7} [{methods}]")
          else:
              print(json.dumps(body, indent=2)[:2000] if isinstance(body, dict) else body)

          print()
          print("=" * 72)
          print("2. LIVE generateContent CALL PER CANDIDATE MODEL")
          print("=" * 72)
          CANDIDATES = [
              "gemini-3.7-flash",         # newest per launch coverage (2026-08-13)
              "gemini-3.6-flash",
              "gemini-3.5-flash",
              "gemini-3-flash",           # GA id, if one exists
              "gemini-3-flash-preview",   # what summarizer.py defaults to today
              "gemini-2.5-flash",         # the proven fallback
          ]
          payload = {
              "contents": [{"parts": [{"text": "Reply with the single word: ok"}]}],
              "generationConfig": {"maxOutputTokens": 500},
          }
          for model in CANDIDATES:
              status, body = call(f"{BASE}/models/{model}:generateContent", payload)
              verdict = "?"
              detail = ""
              if status == 200 and isinstance(body, dict):
                  verdict = "OK"
                  usage = body.get("usageMetadata", {})
                  detail = (f"tokens in/out/total="
                            f"{usage.get('promptTokenCount')}/"
                            f"{usage.get('candidatesTokenCount')}/"
                            f"{usage.get('totalTokenCount')}")
              elif isinstance(body, dict) and "error" in body:
                  err = body["error"]
                  verdict = f"HTTP {status} {err.get('status', '')}".strip()
                  detail = (err.get("message") or "")[:300]
              else:
                  verdict = f"HTTP {status}"
                  detail = str(body)[:300]
              print(f"\n  {model}\n    -> {verdict}\n       {detail}")

          print()
          print("=" * 72)
          print("3. YOUTUBE URL AS VIDEO INPUT (the outage fix we're evaluating)")
          print("=" * 72)
          # Public YouTube URL passed as file_data — Google fetches it server
          # side, which is the whole point: it bypasses the runner IP block that
          # kills youtube-transcript-api, and costs no Supadata credits.
          VIDEO = "https://www.youtube.com/watch?v=oNd79ptPrIo"  # a currently-deferred video
          video_payload = {
              "contents": [{"parts": [
                  {"text": "In one sentence, what is this video about?"},
                  {"file_data": {"file_uri": VIDEO}},
              ]}],
              "generationConfig": {"maxOutputTokens": 800},
              # Low media resolution keeps a 20-minute video inside the free
              # tier's per-minute token budget.
              "mediaResolution": "MEDIA_RESOLUTION_LOW",
          }
          for model in ["gemini-3.7-flash", "gemini-2.5-flash"]:
              status, body = call(f"{BASE}/models/{model}:generateContent", video_payload)
              print(f"\n  {model} + YouTube URL -> HTTP {status}")
              if status == 200 and isinstance(body, dict):
                  usage = body.get("usageMetadata", {})
                  print(f"    tokens in/out/total={usage.get('promptTokenCount')}/"
                        f"{usage.get('candidatesTokenCount')}/{usage.get('totalTokenCount')}")
                  try:
                      text = body["candidates"][0]["content"]["parts"][0]["text"]
                  except (KeyError, IndexError):
                      text = f"(no text part) {json.dumps(body)[:400]}"
                  print(f"    reply: {text[:400]}")
              elif isinstance(body, dict) and "error" in body:
                  print(f"    {body['error'].get('status', '')}: "
                        f"{(body['error'].get('message') or '')[:300]}")
              else:
                  print(f"    {str(body)[:300]}")
          PY
